<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perspective Tester — CSS 3D Playground</title>
  <style>
    :root{
      --perspective: 800px;
      --perspective-origin-x: 50%;
      --perspective-origin-y: 50%;
      --rotate-x: 20deg;
      --rotate-y: -20deg;
      --rotate-z: 0deg;
      --translate-z: 0px;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .app{
      min-height:100vh;display:flex;gap:24px;align-items:center;justify-content:center;padding:28px;background:linear-gradient(135deg,#0f172a 0%, #0b1220 100%);color:#e6eef8
    }
    .stage-wrap{background:rgba(255,255,255,0.04);padding:18px;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,0.6)}
    .stage{
      width:520px;height:360px;display:flex;align-items:center;justify-content:center;
      perspective: var(--perspective);
      perspective-origin: var(--perspective-origin-x) var(--perspective-origin-y);
      border-radius:8px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    }
    .scene{
      width:260px;height:180px;transform-style:preserve-3d;transition:transform 400ms cubic-bezier(.2,.8,.2,1);
      transform: translateZ(var(--translate-z)) rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) rotateZ(var(--rotate-z));
      display:flex;align-items:center;justify-content:center;position:relative;
    }
    .card{
      width:240px;height:160px;border-radius:12px;background:linear-gradient(135deg,#7dd3fc 0%,#60a5fa 100%);box-shadow:0 10px 30px rgba(2,6,23,0.5), inset 0 -6px 30px rgba(255,255,255,0.08);
      display:flex;align-items:center;justify-content:center;color:#06203a;font-weight:700;font-size:20px;backface-visibility:hidden;position:absolute;transform:translateZ(40px);
    }
    .card.back{background:linear-gradient(135deg,#fde68a 0%,#fb923c 100%);transform:rotateY(180deg) translateZ(40px);}

    .controls{width:360px;padding:14px;border-radius:12px;background:rgba(255,255,255,0.02);}
    .control{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    label{min-width:120px;font-size:13px;color:#cfe6ff}
    input[type=range]{flex:1}
    .value{min-width:78px;text-align:right;font-variant-numeric:tabular-nums;color:#9fd2ff}
    .footer{margin-top:12px;font-size:13px;color:#bcdcff}
    .code{margin-top:12px;padding:10px;background:rgba(0,0,0,0.45);border-radius:8px;font-family:monospace;font-size:12px;color:#dff3ff;max-height:160px;overflow:auto}
    .hint{font-size:12px;color:#9fc7ff;margin-bottom:8px}
    .actions{display:flex;gap:8px;margin-top:8px}
    button{background:#0ea5a5;border:none;padding:8px 12px;border-radius:8px;color:white;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.12)}
    @media (max-width:980px){.app{flex-direction:column}.controls{width:100%}.stage{width:320px;height:220px}}
  </style>
</head>
<body>
  <div class="app">

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="scene" id="scene">
          <div class="card front">FRONT</div>
          <div class="card back">BACK</div>
        </div>
      </div>
      <div style="padding:8px 6px;font-size:13px;color:#bcdcff">Try dragging the sliders to change perspective & rotations.</div>
    </div>

    <div class="controls">
      <div class="hint">Perspective controls — live update CSS variables below.</div>
      <div class="control">
        <label for="perspective">perspective</label>
        <input id="perspective" type="range" min="100" max="3000" value="800">
        <div class="value" id="perspectiveVal">800px</div>
      </div>
      <div class="control">
        <label for="originX">perspective-origin-x</label>
        <input id="originX" type="range" min="0" max="100" value="50">
        <div class="value" id="originXVal">50%</div>
      </div>
      <div class="control">
        <label for="originY">perspective-origin-y</label>
        <input id="originY" type="range" min="0" max="100" value="50">
        <div class="value" id="originYVal">50%</div>
      </div>

      <div class="control">
        <label for="rotateX">rotateX</label>
        <input id="rotateX" type="range" min="-90" max="90" value="20">
        <div class="value" id="rotateXVal">20°</div>
      </div>
      <div class="control">
        <label for="rotateY">rotateY</label>
        <input id="rotateY" type="range" min="-180" max="180" value="-20">
        <div class="value" id="rotateYVal">-20°</div>
      </div>
      <div class="control">
        <label for="rotateZ">rotateZ</label>
        <input id="rotateZ" type="range" min="-180" max="180" value="0">
        <div class="value" id="rotateZVal">0°</div>
      </div>
      <div class="control">
        <label for="translateZ">translateZ</label>
        <input id="translateZ" type="range" min="-200" max="200" value="0">
        <div class="value" id="translateZVal">0px</div>
      </div>

      <div class="actions">
        <button id="flip">Flip Card</button>
        <button id="reset" class="ghost">Reset</button>
      </div>

      <div class="footer">CSS snippet applied to <code>#stage</code> and <code>.scene</code> shown below.</div>
      <pre class="code" id="cssCode"></pre>
    </div>
  </div>
  <h1>This is v1</h1>

  <script>
    const root = document.documentElement;
    const els = {
      perspective: document.getElementById('perspective'),
      originX: document.getElementById('originX'),
      originY: document.getElementById('originY'),
      rotateX: document.getElementById('rotateX'),
      rotateY: document.getElementById('rotateY'),
      rotateZ: document.getElementById('rotateZ'),
      translateZ: document.getElementById('translateZ'),
      perspectiveVal: document.getElementById('perspectiveVal'),
      originXVal: document.getElementById('originXVal'),
      originYVal: document.getElementById('originYVal'),
      rotateXVal: document.getElementById('rotateXVal'),
      rotateYVal: document.getElementById('rotateYVal'),
      rotateZVal: document.getElementById('rotateZVal'),
      translateZVal: document.getElementById('translateZVal'),
      cssCode: document.getElementById('cssCode'),
      scene: document.getElementById('scene'),
      stage: document.getElementById('stage'),
      flipBtn: document.getElementById('flip'),
      resetBtn: document.getElementById('reset')
    };

    function updateVar(name, value){
      root.style.setProperty(name, value);
      updateSnippet();
    }

    function updateSnippet(){
      const p = els.perspective.value + 'px';
      const ox = els.originX.value + '%';
      const oy = els.originY.value + '%';
      const rx = els.rotateX.value + 'deg';
      const ry = els.rotateY.value + 'deg';
      const rz = els.rotateZ.value + 'deg';
      const tz = els.translateZ.value + 'px';

      els.cssCode.textContent = `#stage {\n  perspective: ${p};\n  perspective-origin: ${ox} ${oy};\n}\n\n.scene {\n  transform: translateZ(${tz}) rotateX(${rx}) rotateY(${ry}) rotateZ(${rz});\n}`;
    }

    function bindRange(rangeEl, valEl, cssVar, suffix=''){
      const update = ()=>{
        const v = rangeEl.value;
        valEl.textContent = v + suffix;
        if(cssVar) updateVar(cssVar, v + (suffix==='%'?'%':(suffix==='px'? 'px': suffix==='°' ? 'deg' : (cssVar==='--perspective' ? 'px' : ''))));
        // also apply transform vars to root
        if(rangeEl.id==='rotateX') root.style.setProperty('--rotate-x', v+'deg');
        if(rangeEl.id==='rotateY') root.style.setProperty('--rotate-y', v+'deg');
        if(rangeEl.id==='rotateZ') root.style.setProperty('--rotate-z', v+'deg');
        if(rangeEl.id==='translateZ') root.style.setProperty('--translate-z', v+'px');
      };
      rangeEl.addEventListener('input', update);
      update();
    }

    bindRange(els.perspective, els.perspectiveVal, '--perspective', 'px');
    bindRange(els.originX, els.originXVal, '--perspective-origin-x', '%');
    bindRange(els.originY, els.originYVal, '--perspective-origin-y', '%');
    bindRange(els.rotateX, els.rotateXVal, '--rotate-x', '°');
    bindRange(els.rotateY, els.rotateYVal, '--rotate-y', '°');
    bindRange(els.rotateZ, els.rotateZVal, '--rotate-z', '°');
    bindRange(els.translateZ, els.translateZVal, '--translate-z', 'px');

    // Flip button toggles a 180deg Y rotation on the scene
    let flipped = false;
    els.flipBtn.addEventListener('click', ()=>{
      flipped = !flipped;
      els.scene.style.transform = (flipped ? 'translateZ(0px) rotateY(180deg)' : 'translateZ(0px) rotateY(0deg)');
    });

    els.resetBtn.addEventListener('click', ()=>{
      const defaults = {perspective:800,originX:50,originY:50,rotateX:20,rotateY:-20,rotateZ:0,translateZ:0};
      for(const k in defaults){
        const el = document.getElementById(k);
        if(el) el.value = defaults[k];
      }
      // trigger input events
      document.querySelectorAll('input[type=range]').forEach(i=>i.dispatchEvent(new Event('input')));
      flipped = false;
      els.scene.style.transform = '';
    });

    // initialize snippet
    updateSnippet();

    // allow dragging to rotate for quick testing
    let dragging=false, startX=0, startY=0, startRx=0, startRy=0;
    els.stage.addEventListener('pointerdown', (e)=>{dragging=true;startX=e.clientX;startY=e.clientY;startRx=parseFloat(getComputedStyle(root).getPropertyValue('--rotate-x'))||0;startRy=parseFloat(getComputedStyle(root).getPropertyValue('--rotate-y'))||0;els.stage.setPointerCapture(e.pointerId);});
    window.addEventListener('pointerup', ()=>dragging=false);
    window.addEventListener('pointermove',(e)=>{
      if(!dragging) return;
      const dx = e.clientX - startX; const dy = e.clientY - startY;
      const newRx = Math.max(-85,Math.min(85, startRx - dy*0.2));
      const newRy = Math.max(-180,Math.min(180, startRy + dx*0.2));
      document.getElementById('rotateX').value = newRx;
      document.getElementById('rotateY').value = newRy;
      document.getElementById('rotateX').dispatchEvent(new Event('input'));
      document.getElementById('rotateY').dispatchEvent(new Event('input'));
    });
  </script>
</body>
</html>
